<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDT Prüfung Quiz</title>

  <style>

    body{
      margin:0;
      background:#020617;
      color:white;
      font-family:Arial, Helvetica, sans-serif;
      padding:20px;
    }

    .container{
      max-width:1000px;
      margin:auto;
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:25px;
    }

    .quiz-box{
      background:#111827;
      border-radius:22px;
      padding:30px;
      box-shadow:0 0 30px rgba(0,0,0,.4);
    }

    .question{
      font-size:24px;
      line-height:1.5;
      margin-bottom:20px;
    }

    button{
      width:100%;
      padding:16px;
      margin:10px 0;
      border:none;
      border-radius:14px;
      background:#1e293b;
      color:white;
      cursor:pointer;
      font-size:17px;
      transition:.2s;
    }

    button:hover{
      background:#334155;
    }

    .correct{
      background:#16a34a !important;
    }

    .wrong{
      background:#dc2626 !important;
    }

    #nextBtn{
      margin-top:20px;
      background:#0ea5e9;
      font-weight:bold;
    }

    .code{
      background:#0f172a;
      border-radius:14px;
      padding:16px;
      margin-bottom:20px;
      overflow:auto;
      color:#38bdf8;
      font-family:monospace;
    }

    #score{
      text-align:center;
      font-size:30px;
      margin-top:30px;
    }

    .result{
      background:#111827;
      padding:30px;
      border-radius:20px;
      text-align:center;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>MEDT VueJS / Prototyping / Figma Quiz</h1>

  <div class="quiz-box">

    <div id="question" class="question"></div>

    <div id="code"></div>

    <div id="answers"></div>

    <button id="nextBtn">Nächste Frage</button>

  </div>

  <div id="score"></div>

</div>

<script>

  const quiz = [

    {
      q:"Warum muss data() in Vue als Funktion definiert werden?",
      a:[
        "Weil jede Komponente eigene reaktive Daten benötigt",
        "Weil props sonst nicht funktionieren",
        "Weil Vue keine Objekte erlaubt",
        "Weil computed deaktiviert wird"
      ],
      correct:0
    },

    {
      q:"Welche Aussage zu props ist korrekt?",
      a:[
        "Sie dienen zur Datenübergabe zwischen Komponenten",
        "Sie speichern automatisch LocalStorage",
        "Sie ersetzen methods",
        "Sie funktionieren nur mit Zahlen"
      ],
      correct:0
    },

    {
      q:"Was macht computed in VueJS?",
      a:[
        "Berechnet Werte abhängig von Daten",
        "Erstellt automatisch Komponenten",
        "Löscht Arrays",
        "Speichert Daten im Browser"
      ],
      correct:0
    },

    {
      q:"Welche Aussage zu computed stimmt?",
      a:[
        "Computed Properties werden gecacht",
        "Computed wird nur einmal ausgeführt",
        "Computed ersetzt v-for",
        "Computed kann keine Arrays verwenden"
      ],
      correct:0
    },

    {
      q:"Warum wird toLowerCase() oft bei Suchfunktionen verwendet?",
      a:[
        "Damit Groß-/Kleinschreibung ignoriert wird",
        "Weil includes sonst abstürzt",
        "Für bessere Performance",
        "Weil filter es verlangt"
      ],
      correct:0
    },

    {
      q:"Was macht filter()?",
      a:[
        "Es erzeugt ein neues gefiltertes Array",
        "Es löscht automatisch Elemente",
        "Es verändert das Originalarray direkt",
        "Es funktioniert nur mit Strings"
      ],
      correct:0
    },

    {
      q:"Was passiert hier?",
      code:`<button v-on:click="$emit('remove', id)">`,
      a:[
        "Ein Event wird mit Parameter ausgelöst",
        "Die Seite wird neu geladen",
        "Ein CSS Effekt startet",
        "Eine Komponente wird importiert"
      ],
      correct:0
    },

    {
      q:"Welche Aufgabe hat v-bind:key?",
      a:[
        "Elemente eindeutig identifizieren",
        "Events speichern",
        "CSS aktivieren",
        "Arrays sortieren"
      ],
      correct:0
    },

    {
      q:"Welche Aussage zu LocalStorage stimmt?",
      a:[
        "Daten bleiben auch nach Browser-Neustart erhalten",
        "Es speichert nur Zahlen",
        "Es funktioniert nur online",
        "Es löscht Daten automatisch"
      ],
      correct:0
    },

    {
      q:"Warum verwendet man JSON.stringify()?",
      a:[
        "Weil LocalStorage nur Strings speichert",
        "Um Arrays schneller zu machen",
        "Für CSS",
        "Für computed"
      ],
      correct:0
    },

    {
      q:"Was macht JSON.parse()?",
      a:[
        "Es wandelt JSON Strings zurück in Objekte",
        "Es löscht LocalStorage",
        "Es erzeugt HTML",
        "Es speichert Arrays"
      ],
      correct:0
    },

    {
      q:"Was beschreibt einen Sketch am besten?",
      a:[
        "Eine grobe schnelle Ideenskizze",
        "Einen fertigen klickbaren Prototyp",
        "Ein Datenmodell",
        "Eine Datenbankstruktur"
      ],
      correct:0
    },

    {
      q:"Welche Aussage zu Wireframes stimmt?",
      a:[
        "Sie zeigen Struktur ohne echte Funktionalität",
        "Sie enthalten immer echte Daten",
        "Sie sind vollständig programmiert",
        "Sie ersetzen Mockups"
      ],
      correct:0
    },

    {
      q:"Was ist typisch für Mockups?",
      a:[
        "Sie wirken sehr realistisch",
        "Sie enthalten keine Designs",
        "Sie bestehen nur aus Text",
        "Sie haben nie Farben"
      ],
      correct:0
    },

    {
      q:"Was beschreibt einen Prototypen?",
      a:[
        "Ein vereinfachtes System mit Verhalten",
        "Nur HTML ohne Funktion",
        "Eine Datenbank",
        "Nur CSS"
      ],
      correct:0
    },

    {
      q:"Was ist horizontales Prototyping?",
      a:[
        "Viele Funktionen oberflächlich simulieren",
        "Wenige Funktionen vollständig entwickeln",
        "Nur Backend entwickeln",
        "Keine Benutzeroberfläche verwenden"
      ],
      correct:0
    },

    {
      q:"Was ist vertikales Prototyping?",
      a:[
        "Wenige Funktionen detailliert umsetzen",
        "Alle Funktionen grob darstellen",
        "Nur Wireframes verwenden",
        "Nur Navigation zeigen"
      ],
      correct:0
    },

    {
      q:"Was bedeutet Low Fidelity?",
      a:[
        "Einfacher schneller Prototyp",
        "Vollständig realistisches Produkt",
        "Echte Datenbank",
        "Finale fertige App"
      ],
      correct:0
    },

    {
      q:"Was bedeutet High Fidelity?",
      a:[
        "Sehr realistischer detaillierter Prototyp",
        "Grobe Papierzeichnung",
        "Nur ein Konzept",
        "Nur Navigation"
      ],
      correct:0
    },

    {
      q:"Warum spart Prototyping Kosten?",
      a:[
        "Weil Fehler früher entdeckt werden",
        "Weil keine Entwickler benötigt werden",
        "Weil Tests unnötig werden",
        "Weil keine Designs notwendig sind"
      ],
      correct:0
    },

    {
      q:"Welche Aussage zu Figma stimmt?",
      a:[
        "Figma wird häufig für UI/UX Design und Prototyping verwendet",
        "Figma ist eine Datenbank",
        "Figma ersetzt JavaScript",
        "Figma funktioniert nur offline"
      ],
      correct:0
    },

    {
      q:"Wofür verwendet man Figma-Prototyping?",
      a:[
        "Zum Simulieren von Benutzerinteraktionen",
        "Zum Programmieren von Datenbanken",
        "Zum Hosten von Webseiten",
        "Zum Ausführen von VueJS"
      ],
      correct:0
    },

    {
      q:"Was kann man in Figma verbinden?",
      a:[
        "Frames und Screens",
        "Nur CSS Dateien",
        "Nur Bilder",
        "Nur Datenbanken"
      ],
      correct:0
    },

    {
      q:"Welche Aussage über Usability stimmt?",
      a:[
        "Usability verbessert Benutzerfreundlichkeit",
        "Usability betrifft nur Farben",
        "Usability ist nur für Apps wichtig",
        "Usability ersetzt Testing"
      ],
      correct:0
    },

    {
      q:"Was ist ein Vorteil von High Fidelity Prototypen?",
      a:[
        "Realistischere Tests sind möglich",
        "Sie benötigen kein Design",
        "Sie enthalten keine Interaktion",
        "Sie sind schneller als Skizzen"
      ],
      correct:0
    },

    {
      q:"Was ist typisch für Low Fidelity Prototypen?",
      a:[
        "Schnell und günstig",
        "Sehr detailliert",
        "Immer vollständig interaktiv",
        "Fertig programmiert"
      ],
      correct:0
    },

    {
      q:"Was passiert bei diesem Code?",
      code:`localStorage.setItem("user", JSON.stringify(user));`,
      a:[
        "Ein Objekt wird als String gespeichert",
        "Ein Objekt wird gelöscht",
        "Eine Komponente wird erstellt",
        "Ein Event wird ausgelöst"
      ],
      correct:0
    },

    {
      q:"Welche Aussage zu Vue-Komponenten stimmt?",
      a:[
        "Sie kapseln HTML, CSS und JavaScript",
        "Sie bestehen nur aus HTML",
        "Sie ersetzen CSS",
        "Sie können keine Events auslösen"
      ],
      correct:0
    }

  ];

  let current = 0;
  let points = 0;

  const question = document.getElementById("question");
  const answers = document.getElementById("answers");
  const nextBtn = document.getElementById("nextBtn");
  const score = document.getElementById("score");
  const code = document.getElementById("code");

  function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

      const j = Math.floor(Math.random() * (i + 1));

      [array[i], array[j]] = [array[j], array[i]];

    }

    return array;

  }

  function loadQuestion(){

    const q = quiz[current];

    question.textContent = (current+1)+". "+q.q;

    answers.innerHTML = "";

    if(q.code){
      code.innerHTML = `<div class="code">${q.code}</div>`;
    }else{
      code.innerHTML = "";
    }

    let shuffled = q.a.map((text,index)=>({
      text,
      correct:index === q.correct
    }));

    shuffle(shuffled);

    shuffled.forEach(answer=>{

      const btn = document.createElement("button");

      btn.textContent = answer.text;

      btn.onclick = ()=>checkAnswer(btn,answer.correct);

      answers.appendChild(btn);

    });

  }

  function checkAnswer(btn,isCorrect){

    const buttons = answers.querySelectorAll("button");

    buttons.forEach(b=>b.disabled=true);

    if(isCorrect){

      btn.classList.add("correct");

      points++;

    }else{

      btn.classList.add("wrong");

      buttons.forEach(b=>{

        const q = quiz[current];

        if(b.textContent === q.a[q.correct]){

          b.classList.add("correct");

        }

      });

    }

  }

  nextBtn.onclick = ()=>{

    current++;

    if(current < quiz.length){

      loadQuestion();

    }else{

      finishQuiz();

    }

  };

  function finishQuiz(){

    document.querySelector(".quiz-box").style.display = "none";

    let text = "";

    if(points >= 24){
      text = "Sehr gut";
    }else if(points >= 18){
      text = "Gut";
    }else if(points >= 12){
      text = "Befriedigend";
    }else{
      text = "Mehr lernen";
    }

    score.innerHTML = `
<div class="result">
<h2>Quiz beendet</h2>
<p>${points} / ${quiz.length} Punkte</p>
<h3>${text}</h3>
</div>
`;

  }

  loadQuestion();

</script>

</body>
</html>
