<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDT VueJS Prüfung Quiz</title>

  <style>
    body{
      margin:0;
      background:#020617;
      color:white;
      font-family:Arial;
      padding:20px;
    }

    .container{
      max-width:1000px;
      margin:auto;
    }

    h1{
      text-align:center;
      color:#38bdf8;
      margin-bottom:30px;
    }

    .quiz-box{
      background:#111827;
      padding:25px;
      border-radius:20px;
      margin-bottom:20px;
      box-shadow:0 0 25px rgba(0,0,0,.4);
    }

    .question{
      font-size:24px;
      margin-bottom:20px;
      line-height:1.5;
    }

    button{
      width:100%;
      padding:15px;
      margin:10px 0;
      border:none;
      border-radius:14px;
      background:#1e293b;
      color:white;
      cursor:pointer;
      font-size:17px;
      transition:.2s;
    }

    button:hover{
      background:#334155;
    }

    .correct{
      background:#16a34a !important;
    }

    .wrong{
      background:#dc2626 !important;
    }

    #nextBtn{
      background:#0ea5e9;
      font-weight:bold;
    }

    #score{
      text-align:center;
      font-size:30px;
      margin-top:30px;
    }

    .code{
      background:#0f172a;
      padding:15px;
      border-radius:12px;
      margin-top:15px;
      overflow:auto;
      color:#38bdf8;
      font-family:monospace;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>MEDT VueJS / LocalStorage / Prototyping Quiz</h1>

  <div class="quiz-box">

    <div id="question" class="question"></div>

    <div id="code"></div>

    <div id="answers"></div>

    <button id="nextBtn">Nächste Frage</button>

  </div>

  <div id="score"></div>

</div>

<script>

  const quiz = [

    {
      q:"Was ist eine Vue-Komponente?",
      a:[
        "Eine wiederverwendbare UI-Einheit",
        "Eine Datenbank",
        "Ein CSS Framework",
        "Ein Browser"
      ],
      correct:0
    },

    {
      q:"Wo werden Komponenten normalerweise gespeichert?",
      a:[
        "router",
        "assets",
        "components",
        "public"
      ],
      correct:2
    },

    {
      q:"Wofür werden props verwendet?",
      a:[
        "Zur Datenübergabe",
        "Für CSS",
        "Für Events",
        "Für Schleifen"
      ],
      correct:0
    },

    {
      q:"Warum muss data() eine Funktion sein?",
      a:[
        "Weil Vue es verlangt",
        "Damit jede Komponente eigene Daten hat",
        "Für CSS",
        "Wegen HTML"
      ],
      correct:1
    },

    {
      q:"Was macht v-on:click?",
      a:[
        "Es reagiert auf Klicks",
        "Es erstellt Komponenten",
        "Es speichert Daten",
        "Es lädt HTML"
      ],
      correct:0
    },

    {
      q:"Wofür wird $emit() verwendet?",
      a:[
        "Zum Speichern",
        "Zum Auslösen von Events",
        "Zum Löschen",
        "Für CSS"
      ],
      correct:1
    },

    {
      q:"Können mit $emit() Parameter übergeben werden?",
      a:[
        "Ja",
        "Nein",
        "Nur Zahlen",
        "Nur Strings"
      ],
      correct:0
    },

    {
      q:"Was macht v-for?",
      a:[
        "Es löscht Arrays",
        "Es rendert Elemente mehrfach",
        "Es startet Vue",
        "Es speichert Daten"
      ],
      correct:1
    },

    {
      q:"Was macht :key bei v-for?",
      a:[
        "Verbessert Identifikation von Elementen",
        "Erstellt CSS",
        "Startet Events",
        "Löscht Komponenten"
      ],
      correct:0
    },

    {
      q:"Wofür verwendet man computed?",
      a:[
        "Für berechnete Werte",
        "Für HTML",
        "Für CSS",
        "Für Imports"
      ],
      correct:0
    },

    {
      q:"Was macht filter()?",
      a:[
        "Filtert Arrays",
        "Löscht Arrays",
        "Speichert Arrays",
        "Sortiert HTML"
      ],
      correct:0
    },

    {
      q:"Was macht includes()?",
      a:[
        "Durchsucht Texte",
        "Speichert Daten",
        "Erstellt Events",
        "Löscht HTML"
      ],
      correct:0
    },

    {
      q:"Warum verwendet man toLowerCase() bei Suchfunktionen?",
      a:[
        "Für Groß/Kleinschreibung ignorieren",
        "Für Zahlen",
        "Für CSS",
        "Für Events"
      ],
      correct:0
    },

    {
      q:"Was speichert LocalStorage?",
      a:[
        "Nur Strings",
        "Nur Zahlen",
        "Nur Arrays",
        "Nur HTML"
      ],
      correct:0
    },

    {
      q:"Bleiben Daten im LocalStorage nach dem Schließen des Browsers erhalten?",
      a:[
        "Ja",
        "Nein",
        "Nur manchmal",
        "Nur bei Chrome"
      ],
      correct:0
    },

    {
      q:"Welche Funktion wandelt Objekte in Strings um?",
      a:[
        "JSON.parse()",
        "JSON.stringify()",
        "toLowerCase()",
        "filter()"
      ],
      correct:1
    },

    {
      q:"Welche Funktion liest JSON wieder als Objekt?",
      a:[
        "JSON.parse()",
        "JSON.stringify()",
        "v-for",
        "computed"
      ],
      correct:0
    },

    {
      q:"Kann man JavaScript-Objekte direkt in LocalStorage speichern?",
      a:[
        "Nein",
        "Ja",
        "Nur Arrays",
        "Nur Zahlen"
      ],
      correct:0
    },

    {
      q:"Was ist ein Sketch?",
      a:[
        "Grobe schnelle Skizze",
        "Fertige App",
        "Datenbank",
        "Echter Code"
      ],
      correct:0
    },

    {
      q:"Was ist ein Wireframe?",
      a:[
        "Struktur einer Oberfläche",
        "Fertige Website",
        "Eine Datenbank",
        "Ein Server"
      ],
      correct:0
    },

    {
      q:"Was ist ein Prototyp?",
      a:[
        "Vereinfachtes System mit Verhalten",
        "Nur CSS",
        "Eine Datenbank",
        "Nur HTML"
      ],
      correct:0
    },

    {
      q:"Was ist ein Mockup?",
      a:[
        "Sehr realistisches Design",
        "Nur Text",
        "Eine Datenbank",
        "Eine Schleife"
      ],
      correct:0
    },

    {
      q:"Was bedeutet horizontales Prototyping?",
      a:[
        "Viele Funktionen oberflächlich",
        "Wenige Funktionen detailliert",
        "Keine UI",
        "Nur CSS"
      ],
      correct:0
    },

    {
      q:"Was bedeutet vertikales Prototyping?",
      a:[
        "Wenige Funktionen detailliert",
        "Keine Funktionen",
        "Nur Farben",
        "Nur Navigation"
      ],
      correct:0
    },

    {
      q:"Was ist Low Fidelity?",
      a:[
        "Einfacher ungenauer Prototyp",
        "Fertige App",
        "Datenbank",
        "Echter Server"
      ],
      correct:0
    },

    {
      q:"Was ist High Fidelity?",
      a:[
        "Sehr realistischer Prototyp",
        "Skizze",
        "Wireframe",
        "Keine Funktion"
      ],
      correct:0
    },

    {
      q:"Was ist richtig?",
      a:[
        "Je später Fehler entdeckt werden desto teurer",
        "Frühe Fehler sind teurer",
        "Prototyping spart kein Geld",
        "Usability ist unwichtig"
      ],
      correct:0
    },

    {
      q:"Was macht dieses Codebeispiel?",
      code:`<button v-on:click="$emit('remove', index)">`,
      a:[
        "Event mit Parameter senden",
        "Komponente löschen",
        "CSS ändern",
        "HTML rendern"
      ],
      correct:0
    },

    {
      q:"Was macht dieses Codebeispiel?",
      code:`computed:{
 search(){
   return this.sus.filter(...)
 }
}`,
      a:[
        "Suchfunktion",
        "CSS Animation",
        "Import",
        "Event Listener"
      ],
      correct:0
    },

    {
      q:"Was macht dieses Codebeispiel?",
      code:`localStorage.setItem("user", JSON.stringify(user));`,
      a:[
        "Objekt speichern",
        "Objekt löschen",
        "HTML anzeigen",
        "CSS ändern"
      ],
      correct:0
    }

  ];

  let current = 0;
  let points = 0;

  const question = document.getElementById("question");
  const answers = document.getElementById("answers");
  const nextBtn = document.getElementById("nextBtn");
  const score = document.getElementById("score");
  const code = document.getElementById("code");

  function loadQuestion(){

    const q = quiz[current];

    question.textContent = (current+1)+". "+q.q;

    answers.innerHTML = "";

    if(q.code){
      code.innerHTML = `<div class="code">${q.code}</div>`;
    }else{
      code.innerHTML = "";
    }

    q.a.forEach((answer,index)=>{

      const btn = document.createElement("button");

      btn.textContent = answer;

      btn.onclick = ()=>checkAnswer(btn,index);

      answers.appendChild(btn);

    });

  }

  function checkAnswer(btn,index){

    const correct = quiz[current].correct;

    const buttons = answers.querySelectorAll("button");

    buttons.forEach(b=>b.disabled=true);

    if(index === correct){
      btn.classList.add("correct");
      points++;
    }else{
      btn.classList.add("wrong");
      buttons[correct].classList.add("correct");
    }

  }

  nextBtn.onclick = ()=>{

    current++;

    if(current < quiz.length){
      loadQuestion();
    }else{
      finishQuiz();
    }

  };

  function finishQuiz(){

    document.querySelector(".quiz-box").style.display="none";

    let note = "";

    if(points >= 27){
      note = "Sehr gut";
    }else if(points >= 22){
      note = "Gut";
    }else if(points >= 17){
      note = "Befriedigend";
    }else{
      note = "Weiter lernen";
    }

    score.innerHTML = `
<h2>Quiz beendet!</h2>
<p>${points} / ${quiz.length} Punkte</p>
<h3>${note}</h3>
`;

  }

  loadQuestion();

</script>

</body>
</html>
