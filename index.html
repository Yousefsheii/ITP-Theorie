<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TGM - Zuspaetkommen Protokoll</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>Zuspätkommen Protokoll</h1>
        <p>Gemeinsame Einträge mit Datenbank-Speicherung</p>
      </div>
      <div class="badge">TGM</div>
    </header>

    <section class="panel">
      <h2>Neuer Eintrag</h2>
      <form id="entryForm" class="grid">
        <label class="field">
          <span>Eingetragen von</span>
          <input id="createdBy" type="text" placeholder="z. B. Max Mustermann" required />
        </label>
        <label class="field">
          <span>Lehrkraft</span>
          <input id="teacher" type="text" placeholder="z. B. Müller" required />
        </label>
        <label class="field">
          <span>Klasse</span>
          <input id="className" type="text" placeholder="z. B. 3AHIT" required />
        </label>
        <label class="field">
          <span>Datum</span>
          <input id="date" type="date" required />
        </label>
        <label class="field">
          <span>Stunde</span>
          <input id="lesson" type="number" min="1" max="11" required />
        </label>
        <label class="field">
          <span>Verspaetung (Minuten)</span>
          <input id="delayMinutes" type="number" min="0" required />
        </label>
        <label class="field">
          <span>Status</span>
          <select id="status" required>
            <option value="entschuldigt">entschuldigt</option>
            <option value="nicht entschuldigt">nicht entschuldigt</option>
            <option value="offen">offen</option>
          </select>
        </label>
        <label class="field full">
          <span>Notiz</span>
          <textarea id="note" placeholder="Kurze Bemerkung"></textarea>
        </label>
        <div class="actions full">
          <button type="submit">Eintrag speichern</button>
          <button id="clearBtn" type="button" class="secondary">Formular leeren</button>
        </div>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="panel">
      <div class="panelHeader">
        <h2>Letzte Einträge</h2>
        <button id="reloadBtn" type="button" class="secondary">Aktualisieren</button>
      </div>
      <div id="entries" class="entries"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
