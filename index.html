<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MEDT Kotlin Quiz</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 850px;
      background: #111827;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .badge {
      background: #334155;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 14px;
    }

    .card {
      background: #020617;
      border: 1px solid #1f2937;
      border-radius: 20px;
      padding: 24px;
    }

    .question {
      font-size: 24px;
      line-height: 1.35;
      margin-bottom: 20px;
    }

    .category {
      color: #93c5fd;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.15s;
    }

    .answer {
      background: #1f2937;
      color: white;
      text-align: left;
      border: 1px solid #374151;
    }

    .answer:hover {
      transform: translateY(-2px);
      background: #374151;
    }

    .correct {
      background: #166534 !important;
      border-color: #22c55e !important;
    }

    .wrong {
      background: #7f1d1d !important;
      border-color: #ef4444 !important;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .primary {
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #334155;
      color: white;
    }

    .secondary:hover {
      background: #475569;
    }

    .feedback {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      display: none;
      line-height: 1.45;
    }

    .feedback.show {
      display: block;
    }

    .feedback.good {
      background: rgba(22, 101, 52, 0.35);
      border: 1px solid #22c55e;
    }

    .feedback.bad {
      background: rgba(127, 29, 29, 0.35);
      border: 1px solid #ef4444;
    }

    .progress-wrap {
      height: 12px;
      background: #1f2937;
      border-radius: 999px;
      margin: 18px 0;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #3b82f6);
      transition: 0.25s;
    }

    .start-screen,
    .end-screen {
      text-align: center;
      padding: 30px 10px;
    }

    .start-screen p,
    .end-screen p {
      color: #cbd5e1;
      font-size: 17px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 22px 0;
    }

    .stat {
      background: #1f2937;
      border-radius: 16px;
      padding: 16px;
    }

    .stat strong {
      display: block;
      font-size: 26px;
      margin-bottom: 4px;
    }

    .hidden {
      display: none;
    }

    .mode-select {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    code {
      background: #1f2937;
      padding: 2px 6px;
      border-radius: 6px;
      color: #bfdbfe;
    }

    @media (max-width: 600px) {
      .app {
        padding: 18px;
      }

      .question {
        font-size: 20px;
      }

      .stats,
      .mode-select {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main class="app">
  <div class="topbar">
    <h1>MEDT Kotlin Quiz</h1>
    <div class="badge" id="highscoreBadge">Highscore: 0</div>
  </div>

  <section id="startScreen" class="start-screen card">
    <h2>Quizlet-Style Prüfungstraining</h2>
    <p>
      Trainiere MediaPlayer, Permissions, BroadcastReceiver, Animationen, Transitions,
      Kotlin-Basics und besonders deine bisherigen Fehler.
    </p>

    <div class="mode-select">
      <button class="primary" onclick="startQuiz('all')">Gesamter Stoff</button>
      <button class="secondary" onclick="startQuiz('mistakes')">Nur Fehler-Themen</button>
    </div>
  </section>

  <section id="quizScreen" class="hidden">
    <div class="topbar">
      <div class="badge" id="counterBadge">Frage 1 / 1</div>
      <div class="badge" id="scoreBadge">Punkte: 0</div>
      <div class="badge" id="streakBadge">Serie: 0</div>
    </div>

    <div class="progress-wrap">
      <div class="progress" id="progress"></div>
    </div>

    <div class="card">
      <div class="category" id="category"></div>
      <div class="question" id="question"></div>
      <div class="answers" id="answers"></div>

      <div id="textAnswerWrap" class="hidden" style="margin-top:16px;">
        <textarea id="textAnswer" placeholder="Antwort eingeben..." style="width:100%;min-height:120px;background:#111827;color:white;border:1px solid #374151;border-radius:14px;padding:14px;font-size:16px;resize:vertical;"></textarea>
        <button class="primary" style="margin-top:12px;" onclick="submitTextAnswer()">Antwort prüfen</button>
      </div>
      <div class="feedback" id="feedback"></div>

      <div class="controls">
        <button class="primary hidden" id="nextBtn" onclick="nextQuestion()">Nächste Frage</button>
        <button class="secondary" onclick="restart()">Neu starten</button>
      </div>
    </div>
  </section>

  <section id="endScreen" class="end-screen card hidden">
    <h2>Quiz beendet!</h2>
    <div class="stats">
      <div class="stat"><strong id="finalScore">0</strong>Punkte</div>
      <div class="stat"><strong id="finalPercent">0%</strong>Richtig</div>
      <div class="stat"><strong id="wrongCount">0</strong>Fehler</div>
    </div>
    <p id="endText"></p>
    <div class="controls" style="justify-content:center;">
      <button class="primary" onclick="startQuiz('all')">Nochmal alles</button>
      <button class="secondary" onclick="startWrongOnly()">Nur falsche wiederholen</button>
    </div>
  </section>
</main>

<script>
  const questions = [
    // Kotlin
    {
      category: "Kotlin",
      type: "text",
      q: "Schreibe eine unveränderbare String-Konstante appName mit dem Wert MusicApp.",
      answerText: "val appName: String = \"MusicApp\"",
      explain: "Unveränderbare Werte werden mit val erstellt."
    },
    {
      category: "Kotlin",
      q: "Was bedeutet das ? in String??",
      options: ["nullable", "private", "public", "immutable"],
      answer: 0,
      explain: "String? bedeutet, dass null erlaubt ist."
    },
    {
      category: "Kotlin",
      type: "text",
      q: "Schreibe eine veränderbare Integer-Variable counter mit Wert 0.",
      answerText: "var counter: Int = 0",
      explain: "Veränderbare Variablen werden mit var erstellt."
    },

    // MediaPlayer
    {
      category: "MediaPlayer",
      q: "Welche Methode pausiert Audio?",
      options: ["pause()", "stop()", "prepare()", "release()"],
      answer: 0,
      explain: "pause() pausiert die Wiedergabe."
    },
    {
      category: "MediaPlayer",
      q: "Welche Methode gibt bool zurück, ob Audio gerade läuft?",
      options: ["isPlaying()", "playing()", "isRunning()", "audioState()"],
      answer: 0,
      explain: "isPlaying() gibt true oder false zurück."
    },
    {
      category: "MediaPlayer",
      q: "Wo liegen lokale Audiofiles normalerweise?",
      options: ["res/raw", "res/layout", "res/audio", "assets/music"],
      answer: 0,
      explain: "Lokale Audiofiles liegen typischerweise in res/raw."
    },
    {
      category: "MediaPlayer",
      q: "Welche Methode springt zu einer Audioposition?",
      options: ["jumpTo()", "seekTo()", "moveTo()", "goTo()"],
      answer: 1,
      explain: "seekTo() springt zu einer bestimmten Position."
    },
    {
      category: "MediaPlayer",
      q: "Welche Formate unterstützt MediaPlayer unter anderem?",
      options: ["MP3 und AAC", "PSD und AI", "ZIP und RAR", "DOCX und XLSX"],
      answer: 0,
      explain: "MediaPlayer unterstützt z. B. MP3 und AAC."
    },

    // Permissions
    {
      category: "Permissions",
      q: "Wo werden Install-time Permissions eingetragen?",
      options: ["Manifest", "Gradle", "Layout", "styles.xml"],
      answer: 0,
      explain: "Install-time Permissions werden im Manifest eingetragen."
    },
    {
      category: "Permissions",
      q: "Welche Permission wird für Internetzugriff benötigt?",
      options: ["android.permission.INTERNET", "android.permission.URL", "android.permission.WEB", "android.permission.STREAM"],
      answer: 0,
      explain: "Für Internetzugriff benötigt man android.permission.INTERNET."
    },
    {
      category: "Permissions",
      q: "Welche Runtime Permission wird für Audioaufnahme benötigt?",
      options: ["RECORD_AUDIO", "INTERNET", "STREAM_AUDIO", "AUDIO_PERMISSION"],
      answer: 0,
      explain: "Audioaufnahme benötigt RECORD_AUDIO."
    },
    {
      category: "Permissions",
      type: "text",
      q: "Wie heißt die Methode zum Anfragen von Runtime Permissions?",
      answerText: "ActivityCompat.requestPermissions",
      explain: "Permissions werden mit ActivityCompat.requestPermissions(...) angefragt."
    },
    {
      category: "Permissions",
      type: "text",
      q: "Wie heißt die Callback-Methode für Permission-Ergebnisse?",
      answerText: "onRequestPermissionsResult",
      explain: "Das Ergebnis kommt in onRequestPermissionsResult()."
    },

    // BroadcastReceiver
    {
      category: "BroadcastReceiver",
      q: "Von welcher Klasse erbt ein BroadcastReceiver?",
      options: ["BroadcastReceiver", "IntentReceiver", "Activity", "ReceiverActivity"],
      answer: 0,
      explain: "BroadcastReceiver erbt von BroadcastReceiver."
    },
    {
      category: "BroadcastReceiver",
      type: "text",
      q: "Welche Methode wird im BroadcastReceiver überschrieben?",
      answerText: "onReceive",
      explain: "BroadcastReceiver überschreibt onReceive()."
    },
    {
      category: "BroadcastReceiver",
      q: "Welche Methode registriert einen Receiver?",
      options: ["registerReceiver()", "startReceiver()", "enableReceiver()", "addReceiver()"],
      answer: 0,
      explain: "Receiver werden mit registerReceiver() registriert."
    },
    {
      category: "BroadcastReceiver",
      q: "Welche Action gehört zum Flugmodus?",
      options: ["Intent.ACTION_AIRPLANE_MODE_CHANGED", "Intent.FLIGHT_MODE", "Intent.AIRPLANE", "Intent.ACTION_FLIGHT"],
      answer: 0,
      explain: "Die Flugmodus-Action lautet Intent.ACTION_AIRPLANE_MODE_CHANGED."
    },

    // View Animation
    {
      category: "View Animation",
      q: "Welche Begriffe gehören zu View Animationen?",
      options: ["scale rotate alpha translate", "fade explode slide", "ObjectAnimator AnimatorSet", "MediaPlayer seekTo release"],
      answer: 0,
      explain: "scale, rotate, alpha und translate gehören zu View Animationen."
    },
    {
      category: "View Animation",
      q: "In welchem Ordner liegen XML-Animationen?",
      options: ["res/anim", "res/layout", "res/raw", "res/transition"],
      answer: 0,
      explain: "Animationen liegen in res/anim."
    },
    {
      category: "View Animation",
      q: "Welche Klasse lädt XML-Animationen?",
      options: ["AnimationUtils", "AnimatorLoader", "AnimationDrawable", "MediaAnimator"],
      answer: 0,
      explain: "AnimationUtils.loadAnimation() lädt XML-Animationen."
    },

    // Property Animation
    {
      category: "Property Animation",
      q: "Welche Klasse wird für Property Animation verwendet?",
      options: ["ObjectAnimator", "TranslateAnimation", "AnimationDrawable", "FrameAnimator"],
      answer: 0,
      explain: "Property Animation verwendet ObjectAnimator."
    },
    {
      category: "Property Animation",
      q: "Welche Property beschreibt Transparenz?",
      options: ["alpha", "rotate", "translate", "scale"],
      answer: 0,
      explain: "alpha beschreibt Transparenz."
    },
    {
      category: "Property Animation",
      q: "Was passiert bei alpha von 1f zu 0f?",
      options: ["View blendet aus", "View wird größer", "View dreht sich", "View bewegt sich"],
      answer: 0,
      explain: "Die View wird transparent bzw. blendet aus."
    },

    // Frame Animation
    {
      category: "Frame Animation",
      type: "text",
      q: "Welche Klasse gehört zu Frame Animationen?",
      answerText: "AnimationDrawable",
      explain: "Frame Animationen verwenden AnimationDrawable."
    },
    {
      category: "Frame Animation",
      q: "Welches XML-Element verwendet man bei Frame Animationen?",
      options: ["<animation-list>", "<frame>", "<animator>", "<rotate>"],
      answer: 0,
      explain: "Frame Animationen verwenden <animation-list>."
    },

    // Transitions
    {
      category: "Transitions",
      q: "Welche Begriffe sind Activity Transitions?",
      options: ["fade slide explode", "alpha rotate scale", "seekTo start pause", "AnimatorSet ObjectAnimator"],
      answer: 0,
      explain: "Fade, Slide und Explode sind Activity Transitions."
    },
    {
      category: "Transitions",
      q: "Ab welchem API-Level funktionieren Activity Transitions?",
      options: ["21", "14", "8", "30"],
      answer: 0,
      explain: "Transitions funktionieren ab API Level 21."
    },
    {
      category: "Transitions",
      type: "text",
      q: "Wie lautet das vollständige Theme-Attribut für Activity Transitions?",
      answerText: "android:windowActivityTransitions",
      explain: "Das Attribut lautet android:windowActivityTransitions."
    },
    {
      category: "Transitions",
      type: "text",
      q: "Welche Methode muss vor setContentView() aufgerufen werden?",
      answerText: "getWindow().requestFeature",
      explain: "getWindow().requestFeature(...) muss vor setContentView() aufgerufen werden."
    },

    // Wahr/Falsch
    {
      category: "Wahr/Falsch",
      q: "translate gehört zu View Animationen.",
      options: ["Richtig", "Falsch"],
      answer: 0,
      explain: "translate ist eine View Animation."
    },
    {
      category: "Wahr/Falsch",
      q: "Explode ist eine View Animation.",
      options: ["Richtig", "Falsch"],
      answer: 1,
      explain: "Explode ist eine Transition."
    },
    {
      category: "Wahr/Falsch",
      q: "ObjectAnimator gehört zu Property Animation.",
      options: ["Richtig", "Falsch"],
      answer: 0,
      explain: "ObjectAnimator gehört zu Property Animation."
    },
    {
      category: "Wahr/Falsch",
      q: "MediaRecorder kann Audio aufnehmen.",
      options: ["Richtig", "Falsch"],
      answer: 0,
      explain: "MediaRecorder wird für Audioaufnahmen verwendet."
    }
  ];

  let activeQuestions = [];
  let currentIndex = 0;
  let score = 0;
  let streak = 0;
  let answered = false;
  let wrongQuestions = [];

  const startScreen = document.getElementById("startScreen");
  const quizScreen = document.getElementById("quizScreen");
  const endScreen = document.getElementById("endScreen");
  const categoryEl = document.getElementById("category");
  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const feedbackEl = document.getElementById("feedback");
  const nextBtn = document.getElementById("nextBtn");
  const scoreBadge = document.getElementById("scoreBadge");
  const streakBadge = document.getElementById("streakBadge");
  const counterBadge = document.getElementById("counterBadge");
  const progressEl = document.getElementById("progress");
  const highscoreBadge = document.getElementById("highscoreBadge");

  function shuffle(array) {
    return [...array].sort(() => Math.random() - 0.5);
  }

  function updateHighscore() {
    const highscore = localStorage.getItem("medtHighscore") || 0;
    highscoreBadge.textContent = "Highscore: " + highscore;
  }

  function startQuiz(mode) {
    const pool = mode === "mistakes" ? questions.filter(q => q.mistake) : questions;
    activeQuestions = shuffle(pool).map(q => ({ ...q }));
    currentIndex = 0;
    score = 0;
    streak = 0;
    wrongQuestions = [];
    startScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    showQuestion();
  }

  function startWrongOnly() {
    if (wrongQuestions.length === 0) {
      startQuiz("mistakes");
      return;
    }
    activeQuestions = shuffle(wrongQuestions).map(q => ({ ...q }));
    currentIndex = 0;
    score = 0;
    streak = 0;
    wrongQuestions = [];
    endScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    showQuestion();
  }

  function normalizeText(text) {
    return text
            .toLowerCase()
            .replace(/\s\+/g, "")
            .replace(/[():;.=]/g, "");
  }

  function showQuestion() {
    answered = false;
    nextBtn.classList.add("hidden");
    feedbackEl.className = "feedback";
    feedbackEl.textContent = "";
    answersEl.innerHTML = "";
    document.getElementById("textAnswerWrap").classList.add("hidden");
    document.getElementById("textAnswer").value = "";

    const q = activeQuestions[currentIndex];
    categoryEl.textContent = q.category;
    questionEl.innerHTML = q.q;
    counterBadge.textContent = `Frage ${currentIndex + 1} / ${activeQuestions.length}`;
    scoreBadge.textContent = `Punkte: ${score}`;
    streakBadge.textContent = `Serie: ${streak}`;
    progressEl.style.width = `${(currentIndex / activeQuestions.length) * 100}%`;

    if (q.type === "text") {
      document.getElementById("textAnswerWrap").classList.remove("hidden");
      return;
    }

    const shuffledOptions = q.options
            .map((option, index) => ({ option, index }))
            .sort(() => Math.random() - 0.5);

    shuffledOptions.forEach(({ option, index }) => {
      const btn = document.createElement("button");
      btn.className = "answer";
      btn.innerHTML = option;
      btn.onclick = () => checkAnswer(index, btn);
      answersEl.appendChild(btn);
    });
  }

  function submitTextAnswer() {
    if (answered) return;

    const q = activeQuestions[currentIndex];
    const userAnswer = normalizeText(document.getElementById("textAnswer").value);
    const correctAnswer = normalizeText(q.answerText);

    answered = true;

    if (userAnswer.includes(correctAnswer) || correctAnswer.includes(userAnswer)) {
      streak++;
      score += 12 + Math.min(streak * 2, 10);
      feedbackEl.className = "feedback show good";
      feedbackEl.innerHTML = "✅ Richtig!<br>" + q.explain;
    } else {
      streak = 0;
      wrongQuestions.push(q);
      feedbackEl.className = "feedback show bad";
      feedbackEl.innerHTML = `❌ Falsch.<br><strong>Richtige Antwort:</strong><br><code>${q.answerText}</code><br><br>${q.explain}`;
    }

    scoreBadge.textContent = `Punkte: ${score}`;
    streakBadge.textContent = `Serie: ${streak}`;
    nextBtn.classList.remove("hidden");
  }

  function checkAnswer(selectedIndex, selectedBtn) {
    if (answered) return;
    answered = true;

    const q = activeQuestions[currentIndex];
    const buttons = document.querySelectorAll(".answer");
    buttons.forEach((btn, index) => {
      btn.disabled = true;
      if (index === q.answer) btn.classList.add("correct");
    });

    if (selectedIndex === q.answer) {
      streak++;
      score += 10 + Math.min(streak * 2, 10);
      feedbackEl.className = "feedback show good";
      feedbackEl.innerHTML = "✅ Richtig!<br>" + q.explain;
    } else {
      streak = 0;
      selectedBtn.classList.add("wrong");
      wrongQuestions.push(q);
      feedbackEl.className = "feedback show bad";
      feedbackEl.innerHTML = "❌ Falsch.<br>" + q.explain;
    }

    scoreBadge.textContent = `Punkte: ${score}`;
    streakBadge.textContent = `Serie: ${streak}`;
    nextBtn.classList.remove("hidden");
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex >= activeQuestions.length) {
      finishQuiz();
    } else {
      showQuestion();
    }
  }

  function finishQuiz() {
    quizScreen.classList.add("hidden");
    endScreen.classList.remove("hidden");
    progressEl.style.width = "100%";

    const correct = activeQuestions.length - wrongQuestions.length;
    const percent = Math.round((correct / activeQuestions.length) * 100);

    document.getElementById("finalScore").textContent = score;
    document.getElementById("finalPercent").textContent = percent + "%";
    document.getElementById("wrongCount").textContent = wrongQuestions.length;

    const oldHighscore = Number(localStorage.getItem("medtHighscore") || 0);
    if (score > oldHighscore) {
      localStorage.setItem("medtHighscore", score);
    }
    updateHighscore();

    let text = "";
    if (percent >= 90) text = "Sehr stark! Du bist fast prüfungsbereit.";
    else if (percent >= 75) text = "Gut! Wiederhole nur noch die falschen Fragen.";
    else if (percent >= 50) text = "Okay, aber Frame Animation, Permissions und Transitions nochmal üben.";
    else text = "Noch nicht sicher genug. Starte am besten den Fehler-Modus.";

    document.getElementById("endText").textContent = text;
  }

  function restart() {
    startScreen.classList.remove("hidden");
    quizScreen.classList.add("hidden");
    endScreen.classList.add("hidden");
  }

  updateHighscore();
</script>
</body>
</html>
