<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Clash Arena</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #334155, #020617 70%);
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }
    #wrap {
      width: min(96vw, 520px);
      position: relative;
    }
    canvas {
      width: 100%;
      height: auto;
      display: block;
      border: 5px solid #0f172a;
      border-radius: 24px;
      background: #14532d;
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
    }
    .hud {
      margin-top: 12px;
      display: grid;
      gap: 10px;
    }
    .bar {
      background: rgba(15,23,42,.8);
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 999px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 0 0 20px rgba(0,0,0,.25);
    }
    #elixirFill {
      height: 16px;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #a855f7, #ec4899);
      transition: width .15s linear;
    }
    .elixirBox {
      flex: 1;
      height: 20px;
      margin-left: 10px;
      background: #1e1b4b;
      border-radius: 999px;
      padding: 2px;
      border: 1px solid #8b5cf6;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .card {
      cursor: pointer;
      border: 2px solid rgba(255,255,255,.18);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      background: linear-gradient(180deg, #1e293b, #020617);
      box-shadow: 0 8px 18px rgba(0,0,0,.28);
      transition: transform .12s, border-color .12s, opacity .12s;
    }
    .card:hover { transform: translateY(-3px); }
    .card.selected { border-color: #facc15; box-shadow: 0 0 20px rgba(250,204,21,.35); }
    .card.disabled { opacity: .45; cursor: not-allowed; }
    .emoji { font-size: 28px; display: block; }
    .cost { color: #d8b4fe; font-weight: 800; }
    #msg {
      position: absolute;
      left: 50%; top: 45%;
      transform: translate(-50%, -50%);
      font-size: 34px;
      font-weight: 900;
      text-align: center;
      text-shadow: 0 5px 14px black;
      pointer-events: none;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 800;
      cursor: pointer;
      background: #facc15;
      color: #111827;
    }
    .hint { opacity: .8; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="520" height="760"></canvas>
  <div id="msg"></div>
  <div class="hud">
    <div class="bar">
      <strong>Elixier: <span id="elixirText">5</span>/10</strong>
      <div class="elixirBox"><div id="elixirFill"></div></div>
      <button onclick="restart()">Restart</button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="hint">Wähle eine Karte und klicke in deine untere Arena-Hälfte. Ziel: zerstöre den gegnerischen Königsturm.</div>
  </div>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const cards = [
    { name: 'Knight', emoji: '🛡️', cost: 3, hp: 110, dmg: 16, speed: .62, range: 20, rate: 42, color: '#60a5fa' },
    { name: 'Goblin', emoji: '🗡️', cost: 2, hp: 58, dmg: 10, speed: .96, range: 18, rate: 25, color: '#22c55e' },
    { name: 'Giant', emoji: '💪', cost: 5, hp: 260, dmg: 24, speed: .35, range: 24, rate: 60, color: '#fb923c', towerOnly: true },
    { name: 'Archer', emoji: '🏹', cost: 3, hp: 62, dmg: 12, speed: .48, range: 105, rate: 38, color: '#f472b6' }
  ];
  let selected = 0;
  let units, towers, particles, elixir, enemyElixir, gameOver, lastTime, aiTimer;

  function resetState(){
    units = [];
    particles = [];
    elixir = 5;
    enemyElixir = 5;
    gameOver = false;
    aiTimer = 0;
    towers = [
      {team:'blue', x:260, y:660, hp:900, max:900, r:33, king:true},
      {team:'blue', x:150, y:585, hp:520, max:520, r:25},
      {team:'blue', x:370, y:585, hp:520, max:520, r:25},
      {team:'red', x:260, y:100, hp:900, max:900, r:33, king:true},
      {team:'red', x:150, y:175, hp:520, max:520, r:25},
      {team:'red', x:370, y:175, hp:520, max:520, r:25}
    ];
    document.getElementById('msg').textContent = '';
  }

  function restart(){ resetState(); }

  function makeUnit(card, team, x, y){
    units.push({
      ...card,
      team, x, y,
      hp: card.hp,
      max: card.hp,
      cd: Math.random()*20,
      radius: card.name === 'Giant' ? 17 : 13,
      vx: 0, vy: 0
    });
  }

  function spawn(cardIndex, team, x, y){
    const c = cards[cardIndex];
    makeUnit(c, team, x, y);
    if(c.name === 'Goblin') {
      makeUnit(c, team, x-18, y+8*(team==='blue'?-1:1));
      makeUnit(c, team, x+18, y+8*(team==='blue'?-1:1));
    }
    if(c.name === 'Archer') makeUnit(c, team, x+16, y);
  }

  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function aliveTargets(team){
    return [...units.filter(u=>u.team!==team), ...towers.filter(t=>t.team!==team && t.hp>0)];
  }
  function nearest(obj, team, towerOnly=false){
    const list = towerOnly ? towers.filter(t=>t.team!==team && t.hp>0) : aliveTargets(team);
    let best=null, bd=Infinity;
    for(const t of list){ const d=dist(obj,t); if(d<bd){bd=d; best=t;} }
    return best;
  }
  function hit(target, dmg){
    target.hp -= dmg;
    particles.push({x:target.x,y:target.y,life:18,text:'-'+dmg});
  }

  function drawArena(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#166534'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#15803d';
    for(let y=0;y<H;y+=80) for(let x=(y/80)%2?0:40;x<W;x+=80) ctx.fillRect(x,y,40,40);
    ctx.fillStyle = '#38bdf8'; ctx.fillRect(0,H/2-8,W,16);
    ctx.fillStyle = '#92400e'; ctx.fillRect(115,H/2-18,70,36); ctx.fillRect(335,H/2-18,70,36);
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0,H/2-2,W,4);
    ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(0,H/2,W,H/2);
  }

  function drawTower(t){
    ctx.save();
    ctx.translate(t.x,t.y);
    ctx.fillStyle = t.team === 'blue' ? '#2563eb' : '#dc2626';
    ctx.beginPath(); ctx.arc(0,0,t.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#facc15'; ctx.fillRect(-t.r*.55,-t.r-10,t.r*1.1,14);
    if(t.king){ ctx.font='26px serif'; ctx.textAlign='center'; ctx.fillText('👑',0,8); }
    ctx.restore();
    hpBar(t.x-t.r, t.y+t.r+8, t.r*2, 7, t.hp/t.max);
  }

  function hpBar(x,y,w,h,p){
    ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=p>.5?'#22c55e':p>.25?'#facc15':'#ef4444'; ctx.fillRect(x,y,w*Math.max(0,p),h);
  }
  function drawUnit(u){
    ctx.save(); ctx.translate(u.x,u.y);
    ctx.fillStyle = u.color;
    ctx.beginPath(); ctx.arc(0,0,u.radius,0,Math.PI*2); ctx.fill();
    ctx.font = '18px serif'; ctx.textAlign='center'; ctx.fillText(u.emoji,0,6);
    ctx.restore();
    hpBar(u.x-16,u.y-u.radius-12,32,5,u.hp/u.max);
  }

  function update(dt){
    if(gameOver) return;
    elixir = Math.min(10, elixir + dt*0.00055);
    enemyElixir = Math.min(10, enemyElixir + dt*0.0005);
    aiTimer -= dt;
    if(aiTimer <= 0){
      const playable = cards.map((c,i)=>({c,i})).filter(o=>o.c.cost<=enemyElixir);
      if(playable.length){
        const pick = playable[Math.floor(Math.random()*playable.length)];
        enemyElixir -= pick.c.cost;
        spawn(pick.i,'red', Math.random()<.5?150:370, 250 + Math.random()*55);
      }
      aiTimer = 1100 + Math.random()*1600;
    }

    for(const u of units){
      if(u.hp<=0) continue;
      let target = nearest(u,u.team,u.towerOnly);
      if(!target) continue;
      const d = dist(u,target);
      if(d > u.range + (target.r||target.radius||12)){
        const ang = Math.atan2(target.y-u.y, target.x-u.x);
        u.x += Math.cos(ang)*u.speed*dt/16;
        u.y += Math.sin(ang)*u.speed*dt/16;
      } else {
        u.cd -= dt/16;
        if(u.cd<=0){ hit(target,u.dmg); u.cd = u.rate; }
      }
    }

    for(const t of towers.filter(t=>t.hp>0)){
      t.cd = (t.cd||0)-dt/16;
      const enemies = units.filter(u=>u.team!==t.team && u.hp>0 && dist(t,u)<150);
      if(enemies.length && t.cd<=0){
        enemies.sort((a,b)=>dist(t,a)-dist(t,b));
        hit(enemies[0], 20);
        t.cd = 32;
      }
    }

    units = units.filter(u=>u.hp>0);
    towers.forEach(t=>{ if(t.hp<0)t.hp=0; });
    particles.forEach(p=>p.life--);
    particles = particles.filter(p=>p.life>0);

    const blueKing = towers.find(t=>t.team==='blue'&&t.king);
    const redKing = towers.find(t=>t.team==='red'&&t.king);
    if(blueKing.hp<=0 || redKing.hp<=0){
      gameOver = true;
      document.getElementById('msg').textContent = redKing.hp<=0 ? 'SIEG! 👑' : 'NIEDERLAGE!';
    }
  }

  function draw(){
    drawArena();
    towers.filter(t=>t.hp>0).forEach(drawTower);
    units.forEach(drawUnit);
    ctx.font='18px Arial'; ctx.textAlign='center';
    for(const p of particles){ ctx.fillStyle='rgba(255,255,255,'+(p.life/18)+')'; ctx.fillText(p.text,p.x,p.y-(18-p.life)); }
  }

  function loop(ts){
    const dt = Math.min(40, ts - lastTime || 16); lastTime = ts;
    update(dt); draw(); updateUI(); requestAnimationFrame(loop);
  }

  canvas.addEventListener('click', e=>{
    if(gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX-rect.left)*W/rect.width;
    const y = (e.clientY-rect.top)*H/rect.height;
    const c = cards[selected];
    if(y < H/2+20) return flash('Nur in deiner Hälfte!');
    if(elixir < c.cost) return flash('Nicht genug Elixier!');
    elixir -= c.cost;
    spawn(selected,'blue',x,y);
  });
  function flash(text){ const m=document.getElementById('msg'); m.textContent=text; setTimeout(()=>{ if(!gameOver)m.textContent=''; },650); }

  function buildCards(){
    const root = document.getElementById('cards');
    root.innerHTML='';
    cards.forEach((c,i)=>{
      const el=document.createElement('div');
      el.className='card';
      el.innerHTML=`<span class="emoji">${c.emoji}</span><strong>${c.name}</strong><br><span class="cost">${c.cost} Elixier</span>`;
      el.onclick=()=>{ selected=i; updateUI(); };
      root.appendChild(el);
    });
  }
  function updateUI(){
    document.getElementById('elixirText').textContent = Math.floor(elixir);
    document.getElementById('elixirFill').style.width = (elixir*10)+'%';
    [...document.querySelectorAll('.card')].forEach((el,i)=>{
      el.classList.toggle('selected',i===selected);
      el.classList.toggle('disabled',cards[i].cost>elixir);
    });
  }

  buildCards(); resetState(); requestAnimationFrame(loop);
</script>
</body>
</html>
